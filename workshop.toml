# Publishing to the Steam Workshop with paradox-workshop-publish
# (https://github.com/happy-dwarf-team/paradox-workshop-publish).
# The Workshop item ID is remote_file_id in src/descriptor.mod. Without
# `visibility`, publishing never changes it on Steam.
schema = 1

[[mod]]
game = "eu4"
path = "src"
# The Workshop description: every publish replaces it with this file. Write it
# by the team's convention:
# https://github.com/happy-dwarf-team/.github/blob/main/docs/workshop-pages.md
description = "workshop/description.md"
