# Preview a release on every pull request: the job summary shows the files,
# the rendered BBCode description and change note, and any checksum warning.

#
# pull_request runs of the action are always dry runs: nothing is sent to
# Steam, and no secrets or environment are needed. Never run the action on
# pull_request_target; it refuses to.

name: workshop preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: happy-dwarf-team/paradox-workshop-publish@7366a4306b3c81157837bcdce7f138bc86e5d50b # v1.0.0
        with:
          pdx-ws-version: v1.0.0
          dry-run: true
