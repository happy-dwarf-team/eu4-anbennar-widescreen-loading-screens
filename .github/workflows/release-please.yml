# Keeps a release pull request up to date from Conventional Commits on main.
# Merging it bumps `version` in src/descriptor.mod (the line marked
# x-release-please-version), updates CHANGELOG.md and creates a DRAFT release.
# Publishing that draft on GitHub starts workshop-publish.yml.

name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # With the default token the release PR does not trigger CI (GitHub does not
      # start workflows from GITHUB_TOKEN events), so its required checks never
      # report and the merge is refused. The organisation's RELEASE_PLEASE_TOKEN
      # secret, as in the plugin repositories, makes the checks run on it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
